<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Doto:wght@100..900&family=Google+Sans+Flex:wght@400..700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Google Sans Flex", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #CEE2FF; text-decoration: none; } a:hover { color: #FAFCFF; }
    .doto { font-family: "Doto", system-ui, monospace; font-variation-settings: "wght" 900; text-transform: uppercase; }
    .lbl { font-size: 11px; line-height: 16px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; color: #92A0B5; }
    .inp { width: 100%; background: #0a0a0b; border: 1px solid rgba(206,226,255,0.16); border-radius: 8px; padding: 11px 14px; color: #FAFCFF; font-family: inherit; font-size: 15px; line-height: 22px; }
    .inp::placeholder { color: #5c6470; }
    .chip { font-size: 11px; line-height: 16px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 500; padding: 6px 11px; border-radius: 6px; border: 1px solid rgba(206,226,255,0.18); color: #92A0B5; background: transparent; }
    .chip.on { border-color: #CEE2FF; color: #CEE2FF; background: rgba(206,226,255,0.08); }
    .btn { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; font-size: 14px; line-height: 20px; letter-spacing: 0.02em; text-transform: uppercase; border-radius: 8px; padding: 11px 20px; cursor: pointer; font-family: inherit; }
    .btn-primary { background: #CEE2FF; color: #00121f; border: 1px solid #CEE2FF; }
    .btn-ghost { background: transparent; color: #92A0B5; border: 1px solid rgba(206,226,255,0.18); }
  </style>
</helmet>

<div style="min-height: 820px; background: #050506; display: flex; align-items: center; justify-content: center; padding: 40px 24px;">

  <div style="width: 720px; max-width: 100%; background: #101216; border: 1px solid rgba(206,226,255,0.14); border-radius: 16px; box-shadow: 0 32px 80px rgba(0,0,0,0.6); overflow: hidden;">

    <!-- Header -->
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 26px 30px 22px; border-bottom: 1px solid rgba(206,226,255,0.08);">
      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #717C8C;">
          <span style="width: 18px; height: 1px; background: #CEE2FF; opacity: 0.6;"></span> Directorio de builders
        </div>
        <div class="doto" style="font-size: 26px; line-height: 26px; letter-spacing: -0.01em; color: #CEE2FF;">Agrega tu proyecto</div>
      </div>
      <button aria-label="Cerrar" style="flex: none; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid rgba(206,226,255,0.16); border-radius: 8px; color: #92A0B5; cursor: pointer;">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M3 3l9 9M12 3l-9 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"/></svg>
      </button>
    </div>

    <!-- Body grid -->
    <div style="display: flex; flex-direction: column; gap: 20px; padding: 26px 30px 8px;">

      <!-- Row: name + founders -->
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px;">
        <div style="display: flex; flex-direction: column; gap: 7px;">
          <label class="lbl">Nombre del proyecto</label>
          <input class="inp" type="text" placeholder="Ej. Pana Pay">
        </div>
        <div style="display: flex; flex-direction: column; gap: 7px;">
          <label class="lbl">Fundadores</label>
          <input class="inp" type="text" placeholder="Ej. Luis Fernández, Ana Rodríguez">
        </div>
      </div>

      <!-- Description full width -->
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <label class="lbl">Descripción corta</label>
          <span style="font-size: 11px; color: #5c6470; letter-spacing: 0.04em;">0 / 140</span>
        </div>
        <textarea class="inp" rows="2" placeholder="¿Qué construyes? En una o dos frases." style="resize: none; min-height: 68px;"></textarea>
      </div>

      <!-- Row: logo + category -->
      <div style="display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; align-items: start;">
        <div style="display: flex; flex-direction: column; gap: 7px;">
          <label class="lbl">Logo o imagen</label>
          <div style="display: flex; align-items: center; gap: 12px; background: #0a0a0b; border: 1px dashed rgba(206,226,255,0.22); border-radius: 8px; padding: 12px 14px;">
            <div style="flex: none; width: 40px; height: 40px; border-radius: 8px; background: rgba(206,226,255,0.06); border: 1px solid rgba(206,226,255,0.14); display: inline-flex; align-items: center; justify-content: center; color: #CEE2FF;">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 13V4M10 4L6.5 7.5M10 4l3.5 3.5M4 13v2.5h12V13" stroke="currentColor" stroke-width="1.3" stroke-linecap="square"/></svg>
            </div>
            <div style="display: flex; flex-direction: column; gap: 2px;">
              <div style="font-size: 13px; color: #FAFCFF;"><span style="color: #CEE2FF; text-decoration: underline;">Subir</span></div>
              <div style="font-size: 11px; color: #5c6470;">PNG · SVG · JPG</div>
            </div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 9px;">
          <label class="lbl">Categoría</label>
          <div style="display: flex; flex-wrap: wrap; gap: 7px;">
            <span class="chip on">Fintech</span>
            <span class="chip">Marketplace</span>
            <span class="chip">Edtech</span>
            <span class="chip">Healthtech</span>
            <span class="chip">Agritech</span>
            <span class="chip">Logística</span>
            <span class="chip">AI</span>
            <span class="chip">SaaS</span>
            <span class="chip">Otro</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 30px 26px; margin-top: 6px; border-top: 1px solid rgba(206,226,255,0.06);">
      <span style="font-size: 12px; color: #5c6470;">Podrás editarlo cuando quieras.</span>
      <div style="display: flex; gap: 12px;">
        <button class="btn btn-ghost">Cancelar</button>
        <button class="btn btn-primary">
          Publicar proyecto
          <svg viewBox="0 0 17 17" fill="none" style="width: 1.05em; height: 1.05em;"><path d="M4.8 13.1H13.2V14.5H4.8V13.1ZM4.8 0.5H13.2V1.9H4.8V0.5ZM13.2 1.9H14.6V3.3H13.2V1.9ZM3.4 1.9H4.8V3.3H3.4V1.9ZM3.4 11.7H4.8V13.1H3.4V11.7ZM13.2 11.7H14.6V13.1H13.2V11.7ZM2 3.3H3.4V11.7H2V3.3ZM14.6 3.3H16V11.7H14.6V3.3ZM5.5 8.2H6.9V9.6H5.5V8.2ZM6.9 9.6H11.1V11H6.9V9.6ZM11.1 8.2H12.5V9.6H11.1V8.2ZM6.2 4.7H7.6V6.1H6.2V4.7ZM10.4 4.7H11.8V6.1H10.4V4.7Z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
